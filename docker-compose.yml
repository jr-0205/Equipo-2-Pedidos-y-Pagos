name: equipo2

services:
  postgres:
    image: postgres:16-alpine
    container_name: equipo2-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tienda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tienda123}
      POSTGRES_DB: postgres
    ports:
      # Puerto de administración local: NO es uno de los seis microservicios públicos.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - equipo2_postgres_data:/var/lib/postgresql/data
      - ./BD/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - equipo2-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tienda} -d pedidos_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  pagos:
    build:
      context: ./pagos
    container_name: equipo2-pagos
    environment:
      PORT: 3004
      DATABASE_URL: postgresql://${POSTGRES_USER:-tienda}:${POSTGRES_PASSWORD:-tienda123}@postgres:5432/pagos_db
      NOTIFICACIONES_URL: ${NOTIFICACIONES_URL:-}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
    ports:
      # Puerto publicado (host) : puerto interno del contenedor.
      - "${PAGOS_HOST_PORT:-2504}:3004"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - equipo2-net
    restart: unless-stopped

  pedidos:
    build:
      context: ./pedidos
    container_name: equipo2-pedidos
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-tienda}:${POSTGRES_PASSWORD:-tienda123}@postgres:5432/pedidos_db
      # Dentro de esta computadora los servicios se ven por nombre de servicio.
      PAGOS_URL: http://pagos:3004
      # Otros equipos: IP + puerto PUBLICADO (nunca localhost ni nombres de contenedor).
      CLIENTES_URL: ${CLIENTES_URL:-}
      PRODUCTOS_URL: ${PRODUCTOS_URL:-}
      INVENTARIO_URL: ${INVENTARIO_URL:-}
      NOTIFICACIONES_URL: ${NOTIFICACIONES_URL:-}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-5000}
    ports:
      - "${PEDIDOS_HOST_PORT:-2503}:3003"
    depends_on:
      postgres:
        condition: service_healthy
      pagos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - equipo2-net
    restart: unless-stopped

networks:
  # Red interna del Equipo 2: http://postgres:5432, http://pagos:3004.
  equipo2-net:
    driver: bridge

volumes:
  equipo2_postgres_data:
