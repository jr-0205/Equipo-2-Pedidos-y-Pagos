<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Equipo 2 · Pedidos y Pagos</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #edf2ff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 10% 10%, rgba(70, 103, 255, .18), transparent 30rem),
        radial-gradient(circle at 90% 20%, rgba(0, 214, 170, .12), transparent 26rem),
        #0b1020;
    }

    main {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    header {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      align-items: end;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 4rem);
      letter-spacing: -.05em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: #9daccc;
    }

    .badge {
      padding: 8px 12px;
      border: 1px solid #293454;
      border-radius: 999px;
      color: #9daccc;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .card {
      background: rgba(16, 24, 45, .86);
      border: 1px solid #243052;
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .2);
      backdrop-filter: blur(16px);
    }

    .card.full { grid-column: 1 / -1; }

    h2 {
      margin: 0 0 18px;
      font-size: 1.05rem;
    }

    label {
      display: grid;
      gap: 7px;
      color: #a8b4d2;
      font-size: .9rem;
    }

    form {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    input, select, button {
      width: 100%;
      border-radius: 12px;
      border: 1px solid #2a375d;
      background: #0e1730;
      color: #f7f9ff;
      padding: 12px 13px;
      font: inherit;
    }

    button {
      border: 0;
      background: linear-gradient(135deg, #5b77ff, #4ad6b8);
      color: #07101e;
      font-weight: 800;
      cursor: pointer;
    }

    button.secondary {
      background: #16203a;
      color: #dce5ff;
      border: 1px solid #2b385f;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    pre {
      margin: 0;
      min-height: 240px;
      max-height: 460px;
      overflow: auto;
      padding: 16px;
      border-radius: 14px;
      background: #080d1a;
      border: 1px solid #1f2946;
      color: #c8d7ff;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .wide { grid-column: 1 / -1; }

    @media (max-width: 760px) {
      header { align-items: start; flex-direction: column; }
      .grid, form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Pedidos + Pagos</h1>
        <p class="subtitle">Equipo 2 · Tienda Universitaria Distribuida · PostgreSQL</p>
      </div>
      <span class="badge">3003 · 3004</span>
    </header>

    <section class="grid">
      <article class="card">
        <h2>Crear pedido</h2>
        <form id="pedidoForm">
          <label>
            Cliente ID
            <input name="clienteId" type="number" min="1" value="1" required>
          </label>

          <label>
            Producto ID
            <input name="productoId" type="number" min="1" value="1" required>
          </label>

          <label>
            Cantidad
            <input name="cantidad" type="number" min="1" value="1" required>
          </label>

          <label>
            Precio unitario
            <input name="precioUnitario" type="number" min="0" step="0.01" value="100">
          </label>

          <label class="wide">
            Método de pago
            <select name="metodoPago">
              <option value="tarjeta">Tarjeta</option>
              <option value="efectivo">Efectivo</option>
              <option value="transferencia">Transferencia</option>
            </select>
          </label>

          <button class="wide" type="submit">Crear pedido y registrar pago</button>
        </form>
      </article>

      <article class="card">
        <h2>Consultar datos</h2>
        <div class="actions">
          <button id="listarPedidos" class="secondary" type="button">Ver pedidos</button>
          <button id="listarPagos" class="secondary" type="button">Ver pagos</button>
        </div>
        <div class="actions">
          <button id="saludPedidos" class="secondary" type="button">Health pedidos</button>
          <button id="saludPagos" class="secondary" type="button">Health pagos</button>
        </div>
        <p class="subtitle">
          Si las URLs de otros equipos están vacías, el precio se toma del formulario.
        </p>
      </article>

      <article class="card full">
        <h2>Respuesta</h2>
        <pre id="output">Listo para probar.</pre>
      </article>
    </section>
  </main>

  <script>
    const output = document.getElementById('output');
    const host = window.location.hostname || 'localhost';
    const pedidosBase = window.location.origin;
    const pagosBase = window.location.protocol + '//' + host + ':3004';

    async function showRequest(url, options) {
      output.textContent = 'Consultando...';

      try {
        const response = await fetch(url, options);
        const text = await response.text();
        let data = text;

        try {
          data = JSON.parse(text);
        } catch {}

        output.textContent = JSON.stringify({
          status: response.status,
          ok: response.ok,
          data
        }, null, 2);
      } catch (error) {
        output.textContent = JSON.stringify({ error: error.message }, null, 2);
      }
    }

    document.getElementById('pedidoForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = new FormData(event.currentTarget);

      const body = {
        clienteId: Number(form.get('clienteId')),
        productoId: Number(form.get('productoId')),
        cantidad: Number(form.get('cantidad')),
        metodoPago: form.get('metodoPago')
      };

      const precio = form.get('precioUnitario');
      if (precio !== '') {
        body.precioUnitario = Number(precio);
      }

      await showRequest(pedidosBase + '/pedidos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    });

    document.getElementById('listarPedidos').addEventListener('click', () => {
      showRequest(pedidosBase + '/pedidos');
    });

    document.getElementById('listarPagos').addEventListener('click', () => {
      showRequest(pagosBase + '/pagos');
    });

    document.getElementById('saludPedidos').addEventListener('click', () => {
      showRequest(pedidosBase + '/health');
    });

    document.getElementById('saludPagos').addEventListener('click', () => {
      showRequest(pagosBase + '/health');
    });
  </script>
</body>
</html>
